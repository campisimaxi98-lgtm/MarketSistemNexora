<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MarketSistemNexora</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏪</text></svg>">
</head>
<body>
  <div id="login-view">
    <div class="login-card">
      <div class="login-brand">🏪 <span id="login-nombre">MarketSistemNexora</span></div>
      <p class="login-sub">Sistema de gestión de tu negocio</p>
      <form id="login-form">
        <label>Usuario<input id="login-usuario" autocomplete="username" required autofocus></label>
        <label>Contraseña<input id="login-password" type="password" autocomplete="current-password" required></label>
        <button type="submit" class="btn btn-primary btn-block">Ingresar</button>
        <div id="login-error" class="login-error" hidden></div>
      </form>
    </div>
  </div>

  <div id="app-view" hidden>
    <aside class="sidebar">
      <div class="brand">🏪 <span id="app-nombre"></span></div>
      <nav id="main-nav">
        <a href="#/" data-nav="dashboard">📊 Dashboard</a>
        <a href="#/pos" data-nav="pos">🛒 Punto de venta</a>
        <a href="#/productos" data-nav="productos">📦 Productos</a>
        <a href="#/importar" data-nav="importar">📥 Importar / Precios</a>
        <a href="#/stock" data-nav="stock">📉 Stock</a>
        <a href="#/caja" data-nav="caja">💰 Caja</a>
        <a href="#/reportes" data-nav="reportes">📈 Reportes</a>
        <a href="#/tickets" data-nav="tickets">🧾 Tickets</a>
        <a href="#/config" data-nav="config">⚙️ Configuración</a>
      </nav>
      <div class="sidebar-user">
        <div><strong id="app-user"></strong></div>
        <div class="muted" id="app-rol"></div>
        <button id="btn-logout" class="btn btn-ghost btn-sm btn-block">Cerrar sesión</button>
      </div>
    </aside>
    <div class="main">
      <header class="topbar">
        <h1 id="page-title"></h1>
        <span id="topbar-date" class="muted"></span>
      </header>
      <div id="view"></div>
    </div>
  </div>

  <div id="toasts"></div>
  <div id="modal-root"></div>

  <script src="js/qr.js"></script>
  <script src="js/barcode.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/app.js"></script>
  <script src="js/pages/dashboard.js"></script>
  <script src="js/pages/pos.js"></script>
  <script src="js/pages/productos.js"></script>
  <script src="js/pages/importar.js"></script>
  <script src="js/pages/stock.js"></script>
  <script src="js/pages/caja.js"></script>
  <script src="js/pages/reportes.js"></script>
  <script src="js/pages/tickets.js"></script>
  <script src="js/pages/configuracion.js"></script>
  <script>document.addEventListener('DOMContentLoaded', App.init);</script>
</body>
</html>
